# ─────────────────────────────────────────────────────────────────────────────
# Release pipeline for hwt_tool.py (HUAWEI .hwt theme pack/unpack tool).
# Modeled on the CI of dev3haven/free-mozilla-vpn (feature/migrate_to_v2).
#
# Verified toolchain facts (checked on 2026-10-25):
#   * Python 3.15.0 final was released in October 2026; 3.15.1 is not out yet.
#     The version is therefore pinned as "3.15" and resolves automatically to
#     the latest patch release (3.15.1 as soon as it ships).
#   * PyInstaller 6.22.3 supports Python 3.15 — used for the desktop/server
#     targets (linux x86_64 / arm64, windows x86_64 / arm64).
#   * Nuitka currently supports only Python 3.4–3.14, so the Termux build
#     (Termux ships Python 3.14) uses Nuitka instead of PyInstaller.
#   * requirements.txt next to hwt_tool.py is THE single source of truth
#     for runtime deps (one line: Pillow, unpinned). Pillow 13.0.0 is the
#     current release (2026-10-16) and requires Python >=3.11.
#
# Termux workarounds carried over from the reference repo:
#   * Build inside termux/termux-docker:aarch64 with --privileged.
#   * Never bind-mount into the container — COPY the sources in the image
#     (Dockerfile) and docker cp the result out of the STOPPED container.
#   * Install prebuilt python-pillow / libc++ via pkg instead of pip wheels.
#   * PIP_BREAK_SYSTEM_PACKAGES=1 for pip on Termux.
#   * Link against the Termux Python shared library with
#     -lpython$PYVER -lc++_shared; patchelf/binutils/termux-elf-cleaner
#     are installed alongside for the resulting binary.
#   * The smoke test must run and exit 0, otherwise the job fails.
#   * Release assets are uploaded as separate files per target.
# ─────────────────────────────────────────────────────────────────────────────

name: Build HWT Tool

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  SCRIPT: hwt_tool.py
  PYTHON_VERSION: "3.15"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Desktop/server targets — PyInstaller on GitHub-hosted runners.
  # To add another target (e.g. linux-armv9 or windows-x86) just extend
  # the matrix; the steps are identical.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-armv8
          - os: windows-latest
            target: windows-x86_64
          - os: windows-11-arm
            target: windows-arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fail early if requirements.txt is missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt is required next to $SCRIPT (expected content: Pillow)"
            exit 1
          fi
          echo "requirements.txt:"
          cat requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==6.22.3"

      - name: Toolchain info
        run: |
          python -c "import sys, importlib.metadata as md; print(sys.version); print('Pillow', md.version('Pillow')); print('PyInstaller', md.version('PyInstaller'))"

      - name: Build the executable (PyInstaller)
        run: python -m PyInstaller --onefile --console --clean --noconfirm --name "hwt_tool-${{ matrix.target }}" "${{ env.SCRIPT }}"

      - name: Smoke test — must exit 0 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          chmod +x "dist/hwt_tool-${{ matrix.target }}"
          "./dist/hwt_tool-${{ matrix.target }}" --help
          echo "smoke test passed"

      - name: Smoke test — must exit 0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist/hwt_tool-${{ matrix.target }}.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "smoke test passed"

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: hwt-tool-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Termux target — Nuitka inside the official Termux Docker image.
  # continue-on-error: the Termux toolchain drifts often; a failure here must
  # not block the desktop builds or the release.
  # ─────────────────────────────────────────────────────────────────────────
  build-termux:
    name: build (termux-armv8)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Fail early if requirements.txt is missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt is required next to hwt_tool.py (expected content: Pillow)"
            exit 1
          fi

      # FIX: never bind-mount into the Termux container — COPY everything in
      # via the Dockerfile and copy the result out of the stopped container.
      - name: Write the Termux build context
        shell: bash
        run: |
          set -euo pipefail
          cat > Dockerfile <<'EOF'
          FROM termux/termux-docker:aarch64
          COPY hwt_tool.py requirements.txt build_termux.sh /build/
          CMD bash /build/build_termux.sh
          EOF
          cat > build_termux.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          set -euo pipefail
          cd "$HOME"
          cp /build/hwt_tool.py /build/requirements.txt .
          pkg update -y
          # Prebuilt Termux packages: building Pillow from source on-device is slow and fragile.
          pkg install -y python python-pip patchelf ccache binutils ldd termux-elf-cleaner python-pillow libc++
          export PIP_BREAK_SYSTEM_PACKAGES=1
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set
          PYVER="$(python -c 'import sys; print("{}.{}".format(sys.version_info[0], sys.version_info[1]))')"
          export CFLAGS="-I$PREFIX/include"
          # Nuitka links against the Termux Python shared library and libc++_shared.
          export LDFLAGS="-L$PREFIX/lib -lpython${PYVER} -lc++_shared"
          python -m nuitka --onefile --standalone --lto=yes --assume-yes-for-downloads --output-dir="$HOME" --output-filename=hwt_tool.bin hwt_tool.py
          # FIX: the smoke test must exit 0, otherwise the job fails.
          ./hwt_tool.bin --help
          echo "termux smoke test passed"
          EOF
          chmod +x build_termux.sh
          echo "build context ready"

      - name: Build the Docker image
        run: docker build --tag hwt-tool-termux --privileged .

      - name: Run the build and extract the binary
        run: |
          set -euo pipefail
          cid="$(docker create --privileged hwt-tool-termux)"
          # docker start --attach streams the build log and returns the
          # container's exit code, so a failed smoke test fails this step.
          docker start --attach "$cid"
          mkdir -p dist
          docker cp "$cid:/data/data/com.termux/files/home/hwt_tool.bin" dist/hwt_tool-termux-armv8
          docker rm "$cid" >/dev/null
          ls -l dist

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: hwt-tool-termux-armv8
          path: dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Release: attach every binary to the GitHub release for a v* tag.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-termux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: hwt-tool-*
          merge-multiple: true
          path: dist

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
